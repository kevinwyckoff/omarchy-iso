# The installer owns tty1. cloud-init runs whenever a drive labelled cidata is
# attached, which is also how Omarchy's autoinstall drive is found, and its
# units log to journal+console. A cidata drive whose config the installer
# couldn't load covered the wizard in cloud-init output. Keep that output in
# the journal: journalctl -b -u 'cloud-*'
#
# The "cloud-" prefix applies this to every cloud-*.service unit.
[Service]
StandardOutput=journal
